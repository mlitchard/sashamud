# stylish-haskell configuration file
# ==================================

# The stylish-haskell tool is mainly configured by specifying steps. These steps
# are a list, so they have an order, and one specific step may appear more than
# once (if needed). Each file is processed by these steps in the given order.
steps:
  # Format record definitions.
  - records:
      equals: "same_line"
      first_field: "indent 2"
      field_comment: 2
      deriving: 2
      via: "indent 2"
      sort_deriving: true
      break_enums: true
      break_single_constructors: false
      curried_context: false

  # Align the right hand side of some elements.
  - simple_align:
      cases: always
      top_level_patterns: always
      records: always
      multi_way_if: always

  # Import cleanup
  - imports:
      align: global
      pad_module_names: false
      long_list_align: multiline
      empty_list_align: inherit
      list_padding: 2
      separate_lists: true
      space_surround: false
      post_qualify: false
      group_imports: false
      group_rules:
        - match: ".*"
          sub_group: "^[^.]+"

  # Language pragmas
  - language_pragmas:
      style: vertical
      align: true
      remove_redundant: true
      language_prefix: LANGUAGE

  # Remove trailing whitespace
  - trailing_whitespace: {}

columns: 80

newline: native

language_extensions:
  - CPP
  - QuasiQuotes
  - TemplateHaskell

cabal: true
